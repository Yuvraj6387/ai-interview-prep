# Render's free plan puts the backend to sleep after 15 minutes without
# traffic, and waking it takes ~50 seconds. Pinging the health check every
# 10 minutes keeps it awake, so the app loads fast for the next visitor.
# One always-on free service uses ~744 of Render's 750 free hours a month.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl -fsS --max-time 90 --retry 2 https://ai-interview-backend-4bue.onrender.com/api/health
